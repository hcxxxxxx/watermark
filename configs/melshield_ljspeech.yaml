paths:
  data_root: data/LJSpeech-1.1
  output_dir: runs/melshield_ljspeech

mel:
  sample_rate: 22050
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80
  f_min: 20.0
  f_max: 11025.0
  power: 1.0
  eps: 1.0e-5

watermark:
  payload_bits: 32
  key: change-this-secret-key
  alpha: 0.25
  band: [20, 56]
  threshold: 0.61
  headroom: 0.0
  mask_floor: 0.05
  energy_gamma: 0.75
  boundary_margin: 0.02
  align_max_shift: 12

vocoder:
  # mel: no-waveform sanity check
  # griffinlim: checkpoint-free smoke test, not paper-quality
  # hifigan: bundled native HiFi-GAN loader
  # command: external vocoder command with {mel_npy} and {audio_wav}
  name: mel
  checkpoint: checkpoints/hifigan/generator_v1
  config: checkpoints/hifigan/config.json
  command:

evaluation:
  limit:
  attacks: [none, mp3, aac, scale, rs16, bandpass, lowpass, noise20, noise10, noise5, echo]
