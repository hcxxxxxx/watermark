paths:
  data_root: data/LJSpeech-1.1
  output_dir: runs/relmel_hifigan

mel:
  sample_rate: 22050
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80
  f_min: 0.0
  f_max: 8000.0
  power: 1.0
  eps: 1.0e-5

relmel:
  payload_bits: 32
  key: change-this-secret-key
  alpha: 0.06
  band: [20, 56]
  threshold: 0.75
  block_frames: 32
  block_stride:
  min_block_frames: 16
  bits_per_block: 16
  pair_bins: 3
  mask_floor: 0.15
  energy_gamma: 0.5
  boundary_margin: 0.03
  align_max_shift: 12

vocoder:
  name: hifigan
  checkpoint: checkpoints/hifigan/generator_v1
  config: checkpoints/hifigan/config.json
  command:

evaluation:
  limit:
  attacks: [none, mp3, aac, scale, rs16, bandpass, lowpass, noise20, noise10, noise5, echo]
